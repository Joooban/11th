<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>time as us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,340;0,400;0,500;0,600;1,340;1,400;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="avatar">
      <img src="avatar.jpg" alt="" onerror="this.style.display='none'">
    </div>

    <h1 class="title">happy monthsary, bb 💜</h1>
    <p class="subtitle">time as us</p>

    <div class="section" id="elapsedSection">
      <p class="label">together for</p>
      <p class="hero" id="elapsedHero">—</p>
      <p class="clock" id="elapsedClock">00:00:00</p>
    </div>

    <div class="divider">
      <span class="divider-line"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7.5-4.6-10.2-9.1C.2 8.9 1.4 5.3 4.7 4.4c2.1-.6 4.2.4 5.3 2.2C11.1 4.8 13.2 3.8 15.3 4.4c3.3.9 4.5 4.5 2.9 7.5C15.5 16.4 12 21 12 21Z"></path>
      </svg>
      <span class="divider-line"></span>
    </div>

    <div class="section" id="countdownSection">
      <p class="label">until year one</p>
      <p class="hero" id="countdownHero">—</p>
      <p class="clock" id="countdownClock">00:00:00</p>

      <div class="progress-row">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill">
            <span class="progress-handle"></span>
          </div>
          <span class="tick" style="left: 8.333%"></span>
          <span class="tick" style="left: 16.667%"></span>
          <span class="tick" style="left: 25%"></span>
          <span class="tick" style="left: 33.333%"></span>
          <span class="tick" style="left: 41.667%"></span>
          <span class="tick" style="left: 50%"></span>
          <span class="tick" style="left: 58.333%"></span>
          <span class="tick" style="left: 66.667%"></span>
          <span class="tick" style="left: 75%"></span>
          <span class="tick" style="left: 83.333%"></span>
          <span class="tick" style="left: 91.667%"></span>
        </div>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>

      <p class="target-caption" id="targetCaption"></p>
    </div>

    <p class="celebration hidden" id="celebration">happy anniversary — one year, exactly.</p>

    <p class="closing-note">here's to the next one</p>
  </div>

<script src="script.js"></script>
</body>
</html>
